name: Verificações

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (a versão do Cargo.lock)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências do front
        run: npm ci
        working-directory: web
      - name: CLI nativa
        run: cargo build --release -p wind-cli
      - name: Núcleo em WebAssembly
        run: npm run wasm
        working-directory: web
      - name: Testes e verificações
        run: node bench/check.mjs
