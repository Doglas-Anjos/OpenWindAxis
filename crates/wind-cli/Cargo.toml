[package]
name = "wind-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line adapter of wind-core, speaking the wind-api DTOs as JSON."

[[bin]]
name = "wind"
path = "src/main.rs"

[dependencies]
wind-core = { path = "../wind-core" }
wind-api = { path = "../wind-api" }
serde = "1"
serde_json = "1"
