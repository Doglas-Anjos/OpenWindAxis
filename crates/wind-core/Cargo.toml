[package]
name = "wind-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
